<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا تذبح عقاب!</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:#14213d; color:#fff; font-family:system-ui,sans-serif; }
  canvas { background:#1f3b2c; border:4px solid #fca311; border-radius:8px; max-width:95vw; height:auto; touch-action:none; }
  button, label.btn { background:#fca311; color:#14213d; border:0; padding:8px 16px; border-radius:6px; font-size:16px; cursor:pointer; }
  #score { font-size:20px; }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,64px); gap:6px; direction:ltr; }
  .pad button { font-size:28px; padding:0; touch-action:manipulation; }
  .modes { display:flex; gap:8px; }
  .modes button { background:#3a4a6b; color:#fff; }
  .modes button.on { background:#fca311; color:#14213d; }
  h1 { margin:0; font-size:36px; color:#fca311; }
</style>
</head>
<body>
<h1>لا تذبح عقاب!</h1>
<div id="score">النقاط: 0</div>
<canvas id="game" width="600" height="600"></canvas>
<div>
  <button id="startBtn">ابدأ</button> <button id="restart">إعادة اللعب</button>
  
</div>
<div class="modes">
  <button id="modeBtns" class="on">أزرار</button>
  <button id="modeWasd">WASD</button>
</div>
<p id="hint">اضغط ابدأ أو أي اتجاه</p>
<div class="pad">
  <span></span><button data-d="0,-1">▲</button><span></span>
  <button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
</div>

<script>
// ============================================================
// >>> هنا تحط صورتك (السطر 43) <<<
// ضع اسم الصورة بين علامتين التنصيص، والصورة لازم تكون بنفس مجلد الملف
// ============================================================
const IMAGE_SRC ='d:\img.jpeg';

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const size = 20, cells = canvas.width / size;

const personImg = new Image();
personImg.src = IMAGE_SRC;

let snake, dir, nextDir, apple, score, timer, started = false;

function reset() {
  snake = [{x:15,y:15},{x:14,y:15},{x:13,y:15}];
  dir = {x:1,y:0}; nextDir = dir; score = 0;
  document.getElementById("score").textContent = "النقاط: 0";
  placeApple();
  clearInterval(timer);
  started = false;
  document.getElementById("hint").style.display = "";
  draw();
}

function setDir(x, y) {
  if (x === -dir.x && y === -dir.y) return;   // ما يرجع للخلف
  nextDir = {x, y};
  start();
}

function start() {
  if (started) return;
  started = true;
  document.getElementById("hint").style.display = "none";
  clearInterval(timer);
  timer = setInterval(step, 140);
}

function placeApple() {
  do { apple = {x:Math.floor(Math.random()*cells), y:Math.floor(Math.random()*cells)}; }
  while (snake.some(s => s.x===apple.x && s.y===apple.y));
}

function step() {
  dir = nextDir;
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    clearInterval(timer); draw(true); return;
  }
  snake.unshift(head);
  if (head.x===apple.x && head.y===apple.y) {
    score++; document.getElementById("score").textContent = "النقاط: " + score; placeApple();
  } else snake.pop();
  draw();
}

function draw(over) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font = (size-2) + "px serif"; ctx.textBaseline = "top";
  ctx.fillText("🍎", apple.x*size, apple.y*size);
  const N = snake.length;
  const ready = personImg.complete && personImg.naturalWidth;
  snake.forEach((s, i) => {
    const cx = s.x*size + size/2, cy = s.y*size + size/2;
    if (!ready) {
      ctx.fillStyle = i ? "#90e0a0" : "#fff";
      ctx.fillRect(s.x*size, s.y*size, size-1, size-1);
      return;
    }
    // اتجاه الراس لهذا الجزء (اعلى الصورة = ناحية الراس)
    const d = i === 0 ? dir : {x: snake[i-1].x - s.x, y: snake[i-1].y - s.y};
    const ang = Math.atan2(d.x, -d.y);
    // شريحة من الصورة لهذا الجزء: الصورة كلها تتوزع على طول الثعبان
    const sh = personImg.naturalHeight / N;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.drawImage(personImg, 0, i*sh, personImg.naturalWidth, sh, -size/2, -size/2, size, size + 1);
    ctx.restore();
  });
  if (over) {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#fff"; ctx.font = "28px system-ui"; ctx.textAlign = "center";
    ctx.fillText("خسرت! النقاط: " + score, canvas.width/2, canvas.height/2-14);
    ctx.textAlign = "start";
  }
}

let mode = "buttons";
function setMode(m) {
  mode = m;
  document.querySelector(".pad").style.display = m === "buttons" ? "" : "none";
  document.getElementById("modeBtns").classList.toggle("on", m === "buttons");
  document.getElementById("modeWasd").classList.toggle("on", m === "wasd");
  document.getElementById("hint").textContent = m === "wasd" ? "اضغط ابدأ أو W A S D" : "اضغط ابدأ أو أي اتجاه";
}
document.getElementById("modeBtns").onclick = e => { setMode("buttons"); e.target.blur(); };
document.getElementById("modeWasd").onclick = e => { setMode("wasd"); e.target.blur(); };

document.addEventListener("keydown", e => {
  if (mode !== "wasd") return;
  const k = e.key.toLowerCase();
  if (k==="w") setDir(0,-1);
  else if (k==="s") setDir(0,1);
  else if (k==="a") setDir(-1,0);
  else if (k==="d") setDir(1,0);
});

document.querySelectorAll(".pad button").forEach(btn => {
  const go = e => { e.preventDefault(); const [x,y] = btn.dataset.d.split(",").map(Number); setDir(x,y); };
  btn.addEventListener("touchstart", go);
  btn.addEventListener("mousedown", go);
});

// تحكم باللمس (سحب بالاصبع)
let t0;
canvas.addEventListener("touchstart", e => { t0 = e.touches[0]; });
canvas.addEventListener("touchend", e => {
  if (!t0 || mode !== "buttons") return;
  const t = e.changedTouches[0], dx = t.clientX-t0.clientX, dy = t.clientY-t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0 ? 1 : -1, 0);
  else setDir(0, dy>0 ? 1 : -1);
});

personImg.onload = () => draw();
document.getElementById("startBtn").onclick = () => start();
document.getElementById("restart").onclick = () => { reset(); start(); };
reset();
</script>
</body>
</html>
